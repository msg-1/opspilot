# OpsPilot local stack.
# Every port is published on 127.0.0.1 only: nothing here is reachable from the network.
# A shared or production deployment must not publish Postgres or Redis at all, must set
# POSTGRES_PASSWORD, and must put TLS in front of the web app (COOKIE_SECURE=true).
#   Infra only (develop on host):   docker compose up -d postgres redis
#   Full application:               docker compose --profile app up -d --build
#   Observability add-on:           docker compose --profile observability up -d
#   Traces of OPSILUME itself:      npm run tracing:up, then npm run trace -- <investigation id> (docs/tracing.md)
#   Demo microservices (real telemetry and failures to investigate): npm run demo:up, see demo/README.md
name: opspilot

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://opspilot:${POSTGRES_PASSWORD:-opspilot}@postgres:5432/opspilot?schema=public
  REDIS_URL: redis://redis:6379
  API_URL: http://api:4000
  AI_SERVICE_URL: http://ai:8000
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - see .env.example}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env - see .env.example}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env - see .env.example}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  COOKIE_SECURE: "false"
  # The web container is the only proxy in front of the API on the Compose network.
  TRUST_PROXY: uniquelocal
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_DAILY_COST_LIMIT_USD: ${AI_DAILY_COST_LIMIT_USD:-5}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  INVESTIGATION_DAILY_LIMIT: ${INVESTIGATION_DAILY_LIMIT:-50}
  INVESTIGATION_MAX_CONCURRENT: ${INVESTIGATION_MAX_CONCURRENT:-3}
  # Jaeger-compatible trace query API. Empty: no trace store (the demo sets it to http://demo-jaeger:16686).
  TRACES_URL: ${TRACES_URL:-}
  # Tracing of the platform itself, off unless asked for (npm run tracing:up). The endpoint is
  # the `tracing` service below; it is not taken from .env, where it points at localhost.
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tracing:4318

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      POSTGRES_DB: opspilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Applies migrations. Demo data (with documented demo passwords) is loaded only into an
    # empty database, and only while SEED_DEMO_DATA is not "false".
    command: ["sh", "-c", "npx prisma migrate deploy && if [ \"$$SEED_DEMO_DATA\" != \"false\" ]; then node dist/prisma/seed.js --if-empty; fi"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    restart: unless-stopped
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/src/server.js"]
    environment: *app-env
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    restart: unless-stopped
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/src/worker.js"]
    environment: *app-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9464/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ai:
    restart: unless-stopped
    profiles: ["app"]
    build:
      context: services/ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_URL: http://api:4000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env - see .env.example}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8000}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_MAX_COST_USD_PER_INVESTIGATION: ${AI_MAX_COST_USD_PER_INVESTIGATION:-0.50}
      AI_MAX_TOKENS_PER_INVESTIGATION: ${AI_MAX_TOKENS_PER_INVESTIGATION:-400000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Ollama on the host machine, if you run one
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tracing:4318
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:8000:8000"

  web:
    restart: unless-stopped
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    restart: unless-stopped
    profiles: ["observability", "demo"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    restart: unless-stopped
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # ── Demo: three small instrumented services with their own data stores ──────────────────
  # They exist to produce real logs, metrics and traces, and real failures, for OPSILUME to
  # investigate. Local only: nothing here is published beyond 127.0.0.1, nothing is persisted
  # (the database lives in memory), and each container is capped at a few hundred megabytes.
  # Where OPSILUME's own traces go: one trace per investigation, from the HTTP request through
  # the queue, the worker and the AI service to every tool call. Kept apart from demo-jaeger,
  # which holds the telemetry of the systems being investigated. In memory, local only.
  tracing:
    profiles: ["tracing"]
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "2000"
    mem_limit: 384m
    ports:
      - "127.0.0.1:16687:16686" # Jaeger UI and query API
      - "127.0.0.1:4318:4318" # OTLP/HTTP, for services run on the host with `npm run dev`

  demo-postgres:
    profiles: ["demo"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    tmpfs: ["/var/lib/postgresql/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  demo-redis:
    profiles: ["demo"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  demo-jaeger:
    profiles: ["demo"]
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # In-memory storage: about ten minutes of traces at the demo's request rate. More than
      # that does not fit in the memory limit below (found the hard way: the container was killed).
      MEMORY_MAX_TRACES: "4000"
    mem_limit: 512m
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI and query API

  demo-orders: &demo-service
    profiles: ["demo"]
    build: ./demo/services
    env_file:
      - path: demo/.env.demo # written by `npm run demo:setup`: the ingestion key for the demo organisation
        required: false
    environment: &demo-env
      SERVICE_ROLE: orders
      SERVICE_NAME: shop-orders
      SERVICE_VERSION: v1.4.0
      DATABASE_URL: postgresql://shop:shop@demo-postgres:5432/shop
      REDIS_URL: redis://demo-redis:6379
      PAYMENTS_URL: http://demo-payments:8080
      ORDERS_URL: http://demo-orders:8080
      OPSPILOT_API_URL: http://api:4000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://demo-jaeger:4318
      DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-local-demo}
    mem_limit: 256m
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      demo-postgres:
        condition: service_healthy
      demo-redis:
        condition: service_healthy
    healthcheck: &demo-health
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  demo-payments:
    <<: *demo-service
    environment:
      <<: *demo-env
      SERVICE_ROLE: payments
      SERVICE_NAME: shop-payments
      SERVICE_VERSION: v3.0.2
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      demo-redis:
        condition: service_healthy

  demo-gateway:
    <<: *demo-service
    environment:
      <<: *demo-env
      SERVICE_ROLE: gateway
      SERVICE_NAME: shop-gateway
      SERVICE_VERSION: v2.1.0
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      demo-orders:
        condition: service_healthy

  # Steady traffic, so there is a baseline to compare a failure with.
  demo-load:
    profiles: ["demo"]
    build: ./demo/services
    command: ["node", "src/load.cjs"]
    environment:
      GATEWAY_URL: http://demo-gateway:8080
      LOAD_RPS: ${DEMO_LOAD_RPS:-6}
    mem_limit: 128m
    depends_on:
      demo-gateway:
        condition: service_healthy

  # Reads the services' metrics from Prometheus and writes them into OPSILUME.
  demo-bridge:
    profiles: ["demo"]
    build: ./demo/services
    command: ["node", "src/bridge.cjs"]
    restart: unless-stopped
    env_file:
      - path: demo/.env.demo
        required: false
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      OPSPILOT_API_URL: http://api:4000
    mem_limit: 128m
    depends_on:
      - prometheus

volumes:
  pgdata:

name: CI

# Runs on every pull request and on pushes to the long-lived branches.
# Each job is a required status check for develop and main (see docs/git-workflow.md).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "release/**", "hotfix/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check Conventional Commits and attribution rules
        run: |
          status=0
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > /tmp/msg
            .githooks/commit-msg /tmp/msg || { echo "  in commit $sha"; status=1; }
          done
          exit $status

  frontend:
    name: Frontend (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w @opspilot/web
      - run: npm run typecheck -w @opspilot/web
      - run: npm test -w @opspilot/web

  backend:
    name: Backend (lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate -w @opspilot/api
      - run: npm run lint -w @opspilot/api
      - run: npm run typecheck -w @opspilot/api

  database:
    name: Database integration tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot" --health-interval 5s --health-timeout 3s --health-retries 20
      # The queue reliability tests run real BullMQ workers; everything else runs jobs inline.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate -w @opspilot/api
      # Applies every migration to an empty database, then runs the API suite against it.
      - run: npm test -w @opspilot/api

  ai:
    name: AI service (lint, tests, agent evaluations)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/ai }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      # contracts/ is the one definition of what the services share. Everything generated from
      # it, and everything this service exports into it, must be committed and current.
      - name: Shared contracts are up to date
        working-directory: .
        run: |
          node scripts/contracts.mjs
          (cd services/ai && uv run python -m app.contracts)
          git diff --exit-code -- contracts apps/api/src/generated apps/web/src/lib/generated services/ai/app/generated
      - run: uv run pytest -q
      # Regression gate for the investigation engine: every ground-truth scenario must pass.
      - run: uv run python -m app.evals.run --heuristic

  build:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Fails on high or critical advisories in shipped dependencies.
      - run: npm audit --omit=dev --audit-level=high
      - name: Container images
        run: |
          cp .env.example .env
          docker compose --profile app build
      # The demo environment is exercised locally (it needs the whole stack and about 25
      # minutes). Here it only has to build, parse and install without high advisories.
      - name: Demo environment builds
        run: |
          for f in demo/scripts/*.mjs demo/services/src/*.cjs; do node --check "$f"; done
          docker compose --profile demo config -q
          docker build -q demo/services
          (cd demo/services && npm audit --omit=dev --audit-level=high)
